name: Publicar

# En cada cambio a main: revisa el código, publica la API en Cloudflare Workers,
# crea el subdominio en Cloudflare y publica la app web en GitHub Pages.
# En pull requests solo revisa el código.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  ZONA: pensolabs.com
  DOMINIO_WEB: supercoquin.pensolabs.com
  URL_API: https://supercoquin-api.pensolabs.com

jobs:
  revisar:
    name: Revisar código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

  api:
    name: Publicar API (Cloudflare Workers)
    needs: revisar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    steps:
      - name: Revisar que existan los secrets
        id: secrets
        # Sin los secrets no se publica la API (se puede publicar a mano) y la web sigue igual.
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; no se publica la API desde Actions."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
      - name: Aplicar migraciones de la base de datos
        if: steps.secrets.outputs.ok == 'true'
        working-directory: api
        run: npx wrangler d1 migrations apply super-pedidos --remote
      - name: Publicar el Worker
        if: steps.secrets.outputs.ok == 'true'
        working-directory: api
        run: npx wrangler deploy
      - name: Clave de Resend para los códigos por correo
        # Sin este secret la API responde que la entrada por correo no está configurada.
        if: steps.secrets.outputs.ok == 'true' && env.RESEND_API_KEY != ''
        working-directory: api
        run: printf '%s' "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY

  subdominio:
    name: Subdominio en Cloudflare
    needs: revisar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apuntar ${{ env.DOMINIO_WEB }} a GitHub Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Falta CLOUDFLARE_API_TOKEN; no se revisa el subdominio desde Actions."
            exit 0
          fi
          bash .github/scripts/subdominio.sh "$ZONA" "$DOMINIO_WEB" "${{ github.repository_owner }}.github.io"

  web:
    name: Construir app web
    needs: revisar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exportar la web
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: ${{ env.URL_API }}
        run: npx expo export --platform web
      - name: Preparar para GitHub Pages
        working-directory: app/dist
        # 404.html = index.html para que enlaces como /pedido/123 abran la app.
        run: |
          cp index.html 404.html
          touch .nojekyll
          echo "$DOMINIO_WEB" > CNAME
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar-web:
    name: Publicar web (GitHub Pages)
    needs: [api, subdominio, web]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://${{ env.DOMINIO_WEB }}
    steps:
      - uses: actions/deploy-pages@v4
